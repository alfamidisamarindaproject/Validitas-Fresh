<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fresh Validator Pro</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
    <style>
        :root { --primary: #1a936f; --secondary: #114b5f; --bg: #f0f2f5; }
        body { background-color: var(--bg); font-family: 'Inter', system-ui, sans-serif; padding-bottom: 90px; }
        
        /* Sticky Header - Diperkecil agar hemat tempat */
        .sticky-top-custom { position: sticky; top: 0; z-index: 1020; background: var(--primary); color: white; padding: 12px 0; border-radius: 0 0 15px 15px; box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Compact Card Style */
        .data-card { background: #fff; border-radius: 12px; margin-bottom: 10px; box-shadow: 0 2px 5px rgba(0,0,0,0.05); overflow: hidden; border: 1px solid #e9ecef; transition: all 0.2s; }
        .data-card:hover { box-shadow: 0 4px 8px rgba(0,0,0,0.1); }
        
        /* Utils */
        .search-box { border-radius: 8px; border: none; font-size: 0.85rem; padding: 6px 12px; }
        .submit-bar { position: fixed; bottom: 15px; left: 50%; transform: translateX(-50%); width: 90%; max-width: 400px; background: white; padding: 12px 20px; border-radius: 50px; box-shadow: 0 8px 25px rgba(0,0,0,0.25); z-index: 2000; display: none; animation: slideUp 0.3s ease-out; border: 2px solid #198754; }
        @keyframes slideUp { from { bottom: -100px; } to { bottom: 15px; } }
        
        #loading-overlay { position: fixed; top:0; left:0; width:100%; height:100%; background:rgba(255,255,255,0.9); z-index:9999; display:none; flex-direction:column; align-items:center; justify-content:center; }
    </style>
</head>
<body>

<div id="loading-overlay">
    <div class="spinner-border text-success" style="width: 3rem; height: 3rem;"></div>
    <h6 class="mt-3 fw-bold text-success">Sinkronisasi Data...</h6>
</div>

<div class="sticky-top-custom shadow-sm">
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-2">
            <h6 class="fw-bold mb-0"><i class="bi bi-patch-check-fill"></i> Fresh Validator</h6>
            <button class="btn btn-sm btn-light rounded-pill px-3 py-1 shadow-sm" onclick="fetchData()">
                <i class="bi bi-arrow-clockwise"></i> Refresh
            </button>
        </div>
        <div class="row g-2">
            <div class="col-4">
                <input type="text" id="inputToko" class="form-control form-control-sm search-box" placeholder="Toko...">
            </div>
            <div class="col-8">
                <input type="text" id="inputNama" class="form-control form-control-sm search-box" placeholder="Cari Nama PIC...">
            </div>
            <div class="col-12">
                <input type="date" id="inputTanggal" class="form-control form-control-sm search-box text-muted">
            </div>
        </div>
    </div>
</div>

<div class="container mt-3 px-2">
    <div id="cardContainer">
        <div class="text-center py-5 text-muted">
            <div class="spinner-border spinner-border-sm mb-2"></div>
            <p class="small">Memuat data dari GSheet...</p>
        </div>
    </div>
</div>

<div class="submit-bar" id="submitBar">
    <div class="d-flex justify-content-between align-items-center">
        <div>
            <span id="countSelected" class="badge bg-success rounded-pill px-2 py-1 fs-6">0</span> 
            <small class="fw-bold text-muted ms-1" style="font-size: 0.75rem;">Data dipilih</small>
        </div>
        <button onclick="kirimData()" class="btn btn-success btn-sm rounded-pill px-3 shadow fw-bold">
            <i class="bi bi-send-fill"></i> SIMPAN GSHEET
        </button>
    </div>
</div>

<div class="modal fade" id="modalFoto" tabindex="-1">
    <div class="modal-dialog modal-dialog-centered">
        <div class="modal-content border-0 bg-dark">
            <div class="modal-body p-0 text-center position-relative">
                <button type="button" class="btn-close btn-close-white position-absolute top-0 end-0 m-3" data-bs-dismiss="modal" style="z-index: 10;"></button>
                <div id="loadingGambar" class="text-white py-5">
                    <div class="spinner-border"></div>
                    <p class="mt-2 small">Memuat Gambar...</p>
                </div>
                <img src="" id="frameFoto" class="img-fluid rounded shadow" style="display:none; max-height: 85vh; width: 100%; object-fit: contain;">
            </div>
        </div>
    </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
